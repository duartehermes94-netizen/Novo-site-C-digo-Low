name: Deploy Site 2 via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Cache removido pois exige package-lock.json

      - name: 📦 Instalar dependências
        # Alterado de 'npm ci' para 'npm install' para funcionar sem package-lock.json
        run: npm install

      - name: 🏗️ Build do projeto
        run: npm run build

      - name: 🔍 Verificar arquivos gerados
        run: ls -al dist/

      - name: 🚀 Deploy FTP para Hostinger - /site2/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          timeout: 600000
          security: loose
          local-dir: ./dist/
          server-dir: /codigoemocionaldariqueza/
          dangerous-clean-slate: false
