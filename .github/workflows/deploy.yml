name: Deploy Site 2 via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Cache removido pois exige package-lock.json

      - name: 📦 Instalar dependências
        # Alterado de 'npm ci' para 'npm install' para funcionar sem package-lock.json
        run: npm install

      - name: 🏗️ Build do projeto
        run: npm run build

      - name: 🔍 Verificar arquivos gerados
        run: ls -al dist/

      - name: 🚀 Deploy SFTP para Hostinger
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USER }}
          server: ${{ secrets.FTP_HOST }}
          port: 22
          ssh_private_key: ${{ secrets.FTP_PASS }} # Se usar senha, mude para password: ${{ secrets.FTP_PASS }}
          password: ${{ secrets.FTP_PASS }}
          local_path: './dist/*'
          remote_path: '/codigoemocionaldariqueza/'
          sftpArgs: '-o ConnectTimeout=5'
